name: Publish tagged Python client
on:
  push:
    tags:
      - 'client-v*'
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'terrestream/terrestream'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert os.environ["RELEASE_TAG"] == "client-v" + p["project"]["version"]'
      - run: python -m pip install -e . -r requirements-test.txt
      - run: python tools/verify.py
      - run: python -m build
      - run: python tools/package_release.py
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/terrestream-local
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
