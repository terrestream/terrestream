name: Verify integration and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements-test.txt
      - run: python tools/verify.py
      - run: python -m build
      - run: python tools/package_release.py
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-distributions
          path: dist/
  client-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.13', '3.14']
        protobuf: ['5.29.6', '6.33.6', '7.36.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . "protobuf==${{ matrix.protobuf }}" pytest pytest-asyncio pytest-aiohttp pytest-socket
      - name: Run independent client protocol tests
        run: |
          mkdir -p /tmp/terrestream-client-tests
          cp tests/test_client.py /tmp/terrestream-client-tests/
          python -m pytest --noconftest -q /tmp/terrestream-client-tests/test_client.py
