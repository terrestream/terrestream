name: Verify integration and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python tools/verify.py
      - name: Verify optional Alexa companion
        run: |
          python -m ruff check alexa --exclude node_modules
          python -m ruff format --check alexa --exclude node_modules
          python -m unittest discover -s alexa -p 'test_*.py'
          npm ci --ignore-scripts --no-audit --no-fund --prefix alexa
          npm test --prefix alexa
      - run: python -m build
      - run: python tools/package_release.py
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-distributions
          path: dist/
  client-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.13', '3.14']
        protobuf: ['5.29.6', '6.33.6', '7.36.0', '7.36.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'protobuf==${{ matrix.protobuf }}' pytest pytest-asyncio pytest-aiohttp pytest-socket
      - name: Run independent client protocol tests
        run: |
          mkdir -p /tmp/terrestream-client-tests
          cp tests/test_client.py /tmp/terrestream-client-tests/
          python -m pytest --noconftest -q /tmp/terrestream-client-tests/test_client.py
  minimum-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . 'homeassistant==2026.9.3' 'pytest-homeassistant-custom-component==0.13.366' 'protobuf==6.32.0'
      - run: python -m pytest tests -q
