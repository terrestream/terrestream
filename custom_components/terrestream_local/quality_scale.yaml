# Implementation checklist; HA has not awarded a quality tier.
# Source evidence: README.md, docs/migration.md, docs/release-status.md and tests/.
rules:
  action-setup:
    status: done
    comment: Admin profile actions are registered in async_setup and reject missing, unloaded or unsupported entries.
  appropriate-polling:
    status: done
    comment: One coordinator polls each device every five seconds; no per-entity polling. Expiry timers preserve acquisition freshness independently.
  brands:
    status: todo
    comment: Local custom-integration assets are included; Core artwork still requires a separate brands PR and acceptance.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The licensed client wheel and source are built locally; public source, issue tracker and PyPI publication are pending.
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: No custom device triggers. Standard entity triggers and blueprint restart behavior are documented in README.md.
  docs-conditions:
    status: exempt
    comment: No custom device conditions. Standard numeric and availability conditions are documented in README.md.
  docs-high-level-description: done
  docs-installation-instructions:
    status: todo
    comment: Development setup is documented in CONTRIBUTING.md; HA OS and Linux Container installation require acceptance with the published package.
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: Maintainer @Xynergi is listed in the manifest; public repository access and maintenance confirmation are pending.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: tools/verify.py requires more than 95 percent combined statement and branch coverage per integration module.
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each entry represents one fixed physical Terrestream℠ Indoor Air Quality sensor, not a hub or cloud roster. New devices get independent config entries.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Reauth handles revoked trust; controller conflicts, offline removal and failed history migration have actionable repair notices.
  stale-devices:
    status: exempt
    comment: Each entry represents one fixed physical Terrestream℠ Indoor Air Quality sensor. Remove the config entry to remove its device; transient absence preserves history.
  async-dependency:
    status: done
    comment: Injected aiohttp session with async I/O; SRP computation is offloaded to a worker thread. No vendor-cloud calls from HA.
  inject-websession: done
  strict-typing:
    status: done
    comment: Strict mypy checks 21 integration/client modules. Dynamic upstream protobuf descriptors have narrowly scoped attribute annotations; vendored upstream implementation is excluded.
